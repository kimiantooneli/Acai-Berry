<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - Acai Bowl Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#f7efff,#eadcff);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card{
    width:350px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(155,89,182,.2);
    text-align:center;
}

h1{
    color:#9b59b6;
    margin-bottom:10px;
}

p{
    color:#666;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:2px solid #eadcff;
    border-radius:10px;
    margin-bottom:15px;
    outline:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#9b59b6;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#7d3c98;
}
</style>

</head>

<body>

<div class="card">

<h1>🍓 Acai Bowl Store</h1>

<p>Selamat datang! Pilih role untuk melanjutkan.</p>

<input
type="text"
id="username"
placeholder="Masukkan nama pembeli...">

<button onclick="loginBuyer()">
🛒 Masuk sebagai Pembeli
</button>

<div style="margin:20px 0;color:#888;">
──────── atau ────────
</div>

<button
onclick="showSellerLogin()"
style="background:#7d3c98;">
🏪 Masuk sebagai Penjual
</button>

<div
id="sellerLogin"
style="display:none;margin-top:20px;">

<input
type="password"
id="sellerPassword"
placeholder="Password Penjual">

<button
onclick="loginSeller()"
style="background:#6c3483;">
Masuk ke Dashboard
</button>

</div>

</div>

<script>

function loginBuyer(){

const username=document.getElementById("username").value.trim();

if(username===""){
alert("Masukkan nama terlebih dahulu!");
return;
}

localStorage.setItem("acai_user",username);

window.location.href="home.html";

}

function showSellerLogin(){

document.getElementById("sellerLogin").style.display="block";

}

function loginSeller(){

const password=document.getElementById("sellerPassword").value;

if(password==="admin123"){

window.location.href="seller.html";

}else{

alert("Password penjual salah!");

}

}

</script>

</body>
</html>
