<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Penjualan</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#fcf8ff;
}

.navbar{
background:white;
padding:15px 25px;
box-shadow:0 4px 15px rgba(155,89,182,.15);
display:flex;
justify-content:space-between;
align-items:center;
}

h2{
color:#9b59b6;
}

.container{
max-width:1100px;
margin:30px auto;
padding:20px;
}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 15px rgba(155,89,182,.12);
text-align:center;
}

.card h3{
color:#9b59b6;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 15px rgba(155,89,182,.12);
}

th{
background:#f3e8f9;
padding:15px;
color:#9b59b6;
}

td{
padding:15px;
text-align:center;
border-bottom:1px solid #eee;
}

.btn{
display:inline-block;
padding:10px 18px;
background:#9b59b6;
color:white;
text-decoration:none;
border-radius:10px;
margin-left:10px;
font-weight:bold;
cursor:pointer;
border:none;
}

.btn:hover{
background:#7d3c98;
}

</style>

</head>

<body>

<div class="navbar">

<h2>🧾 Laporan Penjualan</h2>

<div>

<a href="seller.html" class="btn">
🏪 Dashboard
</a>

<button class="btn" onclick="window.print()">
🖨️ Cetak
</button>

</div>

</div>

<div class="container">

<div class="summary">

<div class="card">
<h3>Total Pesanan</h3>
<h2 id="totalOrder">0</h2>
</div>

<div class="card">
<h3>Total Pendapatan</h3>
<h2 id="totalIncome">Rp0</h2>
</div>

<div class="card">
<h3>Status</h3>
<h2>Aktif ✅</h2>
</div>

</div>

<table>

<thead>

<tr>
<th>No</th>
<th>Produk</th>
<th>Jumlah</th>
<th>Total</th>
</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

</div>

<script>

const orders=JSON.parse(localStorage.getItem("acai_orders"))||[];

const tbody=document.getElementById("reportTable");

let total=0;

orders.forEach((item,index)=>{

total+=item.total;

tbody.innerHTML+=`

<tr>

<td>${index+1}</td>

<td>${item.name}</td>

<td>${item.qty}</td>

<td>${new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(item.total)}</td>

</tr>

`;

});

document.getElementById("totalOrder").textContent=orders.length;

document.getElementById("totalIncome").textContent=
new Intl.NumberFormat("id-ID",{
style:"currency",
currency:"IDR",
maximumFractionDigits:0
}).format(total);

if(orders.length===0){

tbody.innerHTML=`
<tr>
<td colspan="4">
Belum ada transaksi.
</td>
</tr>
`;

}

</script>

</body>
  </html>
