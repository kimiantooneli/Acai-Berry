<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tambah Produk</title>

<style>

body{
font-family:Arial,sans-serif;
background:#fcf8ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
background:white;
padding:30px;
border-radius:20px;
width:350px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h2{
color:#9b59b6;
margin-bottom:20px;
text-align:center;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
border:2px solid #eadcff;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:#9b59b6;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>Tambah Produk</h2>

<input id="name" placeholder="Nama Produk">

<input id="price" type="number" placeholder="Harga">

<input id="image" placeholder="images/contoh.jpg">

<button onclick="saveProduct()">

Simpan Produk

</button>

</div>

<script>

function saveProduct(){

const name=document.getElementById("name").value;
const price=parseInt(document.getElementById("price").value);
const image=document.getElementById("image").value;

let products=JSON.parse(localStorage.getItem("acai_products"))||[];

products.push({
id:Date.now().toString(),
name:name,
price:price,
image:image
});

localStorage.setItem("acai_products",JSON.stringify(products));

</body>

</html>
