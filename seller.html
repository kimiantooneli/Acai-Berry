<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller - Tambah Produk</title>
  <style>
    :root { --primary: #9b59b6; --primary-light: #f3e8f9; --bg-soft: #fcf8ff; --white: #ffffff; --text: #333; --shadow: 0 4px 15px rgba(155, 89, 182, 0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-soft); color: var(--text); padding-bottom: 40px; }
    .navbar { background: var(--white); box-shadow: var(--shadow); padding: 15px; position: sticky; top: 0; z-index: 10; }
    .nav-container { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .brand { color: var(--primary); font-size: 1.3rem; font-weight: bold; text-decoration: none; }
    .container { max-width: 500px; margin: 30px auto; padding: 0 15px; }
    .card { background: var(--white); border-radius: 16px; padding: 25px; box-shadow: var(--shadow); border: 1px solid var(--primary-light); }
    h2 { color: var(--primary); margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
    .form-control { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; }
    .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
    .btn-link { display: block; text-align: center; color: var(--primary); text-decoration: none; margin-top: 15px; font-size: 0.85rem; font-weight: bold; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="seller.html" class="brand">🍓 Dashboard Penjual</a>
      <a href="home.html" style="text-decoration:none; color:var(--primary); font-weight:bold;">Lihat Toko 🛍️</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>➕ Tambah Produk Baru</h2>
      <form id="addForm" onsubmit="tambahProduk(event)">
        <div class="form-group">
          <label>Nama Produk</label>
          <input type="text" id="prodName" class="form-control" placeholder="Contoh: Dragon Acai Bowl" required>
        </div>
        <div class="form-group">
          <label>Harga (Rp)</label>
          <input type="number" id="prodPrice" class="form-control" placeholder="Contoh: 45000" required>
        </div>
        <div class="form-group">
          <label>URL Gambar (Contoh .jpg / .png)</label>
          <input type="url" id="prodImage" class="form-control" placeholder="https://images.unsplash.com/..." required>
        </div>
        <button type="submit" class="btn-submit">Simpan Produk 🎉</button>
        <a href="home.html" class="btn-link">← Kembali ke Halaman Utama</a>
      </form>
    </div>
  </div>

  <script>
    const defaultProducts = [
      { id: "1", name: "Berry Acai Bowl", price: 45000, image: "https://images.unsplash.com/photo-1590301157890-4810ed352733?auto=format&fit=crop&w=400&q=80" },
      { id: "2", name: "Banana Acai Bowl", price: 40000, image: "https://images.unsplash.com/photo-1511690656952-34342bb7c2f2?auto=format&fit=crop&w=400&q=80" },
      { id: "3", name: "Mango Acai Bowl", price: 42000, image: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='400' height='300' fill='%23FFE082'/><circle cx='200' cy='150' r='90' fill='%23FFB300'/><circle cx='200' cy='150' r='75' fill='%238E24AA'/><circle cx='180' cy='130' r='20' fill='%23FFEB3B'/><circle cx='220' cy='160' r='18' fill='%23FF8F00'/><text x='50%25' y='88%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='22' fill='%235D4037'>🥭 Mango Acai Bowl</text></svg>" },
      { id: "4", name: "Choco Acai Special", price: 48000, image: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80" }
    ];

    function tambahProduk(e) {
      e.preventDefault();
      
      const name = document.getElementById('prodName').value;
      const price = parseInt(document.getElementById('prodPrice').value);
      const image = document.getElementById('prodImage').value;

      // Ambil daftar produk yang ada
      let products = JSON.parse(localStorage.getItem('acai_products'));
      if (!products || products.length === 0) {
        products = defaultProducts;
      }

      // Buat data produk baru
      const newProduct = {
        id: Date.now().toString(),
        name: name,
        price: price,
        image: image
      };

      // Tambahkan ke array dan simpan
      products.push(newProduct);
      localStorage.setItem('acai_products', JSON.stringify(products));

      alert("Produk " + name + " berhasil ditambahkan!");
      
      // Kosongkan form
      document.getElementById('addForm').reset();
    }
  </script>
</body>
</html>
