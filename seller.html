<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Dashboard - Acai Bowl Store</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#fcf8ff;
}

.navbar{
background:white;
padding:15px 25px;
box-shadow:0 4px 15px rgba(155,89,182,.15);
}

.navbar h2{
color:#9b59b6;
}

.container{
max-width:1100px;
margin:30px auto;
padding:20px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.btn{
padding:10px 18px;
border:none;
border-radius:10px;
background:#9b59b6;
color:white;
font-weight:bold;
text-decoration:none;
cursor:pointer;
}

.btn:hover{
background:#7d3c98;
}

table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 4px 15px rgba(155,89,182,.15);
}

th{
background:#f3e8f9;
padding:15px;
color:#9b59b6;
}

td{
padding:15px;
text-align:center;
border-bottom:1px solid #eee;
}

img{
width:70px;
height:70px;
object-fit:cover;
border-radius:10px;
}

</style>

</head>

<body>

<div class="navbar">
<h2>🏪 Dashboard Penjual</h2>
</div>

<div class="container">

<div class="top">

<h3>Daftar Produk</h3>

<a href="home.html" class="btn">
⬅ Kembali ke Toko
</a>

</div>

<table>

<thead>

<tr>

<th>Gambar</th>
<th>Nama Produk</th>
<th>Harga</th>

</tr>

</thead>

<tbody id="sellerTable">

</tbody>

</table>

</div>

<script>

const products=[

{
id:"1",
name:"Berry Acai Bowl",
price:45000,
image:"images/berry.jpg"
},

{
id:"2",
name:"Banana Acai Bowl",
price:40000,
image:"images/banana.jpg"
},

{
id:"3",
name:"Mango Acai Bowl",
price:42000,
image:"images/mango.jpg"
},

{
id:"4",
name:"Choco Acai Special",
price:48000,
image:"images/choco.jpg"
}

];

function formatRupiah(number){

return new Intl.NumberFormat("id-ID",{

style:"currency",

currency:"IDR",

maximumFractionDigits:0

}).format(number);

}

const tbody=document.getElementById("sellerTable");

products.forEach(product=>{

tbody.innerHTML+=`

<tr>

<td>

<img src="${product.image}">

</td>

<td>

${product.name}

</td>

<td>

${formatRupiah(product.price)}

</td>

</tr>

`;

});

</script>

</body>
</html>
